name: higgsden

x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-higgsden}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-higgsden}
  POSTGRES_DB: ${POSTGRES_DB:-higgsden}
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-higgsden_app}
  OPERATOR_DB_PASSWORD: ${OPERATOR_DB_PASSWORD:-higgsden_operator}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: *db-env
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_OWNER_URL: postgres://${POSTGRES_USER:-higgsden}:${POSTGRES_PASSWORD:-higgsden}@postgres:5432/${POSTGRES_DB:-higgsden}
      SEED_RESET: ${SEED_RESET:-false}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: api
    environment:
      NODE_ENV: development
      API_PORT: 3000
      DATABASE_URL: postgres://${APP_DB_USER:-higgsden_app}:${APP_DB_PASSWORD:-higgsden_app}@postgres:5432/${POSTGRES_DB:-higgsden}
      DATABASE_OPERATOR_URL: postgres://higgsden_operator:${OPERATOR_DB_PASSWORD:-higgsden_operator}@postgres:5432/${POSTGRES_DB:-higgsden}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-any-shared-environment-0123456789}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      INTERNAL_API_URL: http://localhost:3000
      DEV_SIGN_IN: ${DEV_SIGN_IN:-true}
      TEST_API: ${TEST_API:-true}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build:
      context: .
      target: worker
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DATABASE_URL: postgres://${APP_DB_USER:-higgsden_app}:${APP_DB_PASSWORD:-higgsden_app}@postgres:5432/${POSTGRES_DB:-higgsden}
      DATABASE_OPERATOR_URL: postgres://higgsden_operator:${OPERATOR_DB_PASSWORD:-higgsden_operator}@postgres:5432/${POSTGRES_DB:-higgsden}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-any-shared-environment-0123456789}
      EMBEDDING_SERVICE_URL: http://embedding-service:8000
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  embedding-service:
    build:
      context: ./apps/embedding-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
